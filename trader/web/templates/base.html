<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Trade logic{% endblock %}</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #18181b;
      --muted: #52525b;
      --border: #d4d4d8;
      --thead-bg: #e4e4e7;
      --row-alt: #f4f4f5;
      --row-hover: #e0e7ff;
      --accent: #2563eb;
      --chip-buy: #166534;
      --chip-buy-bg: #dcfce7;
      --chip-sell: #991b1b;
      --chip-sell-bg: #fee2e2;
      --chip-hold: #52525b;
      --chip-hold-bg: #f4f4f5;
      --chip-halt: #7c2d12;
      --chip-halt-bg: #ffedd5;
      --code-bg: #1e1e1e;
      --code-fg: #e4e4e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --thead-bg: #27272a;
        --row-alt: #27272a;
        --row-hover: #3f3f46;
        --accent: #60a5fa;
        --chip-buy-bg: #14532d;
        --chip-buy: #bbf7d0;
        --chip-sell-bg: #7f1d1d;
        --chip-sell: #fecaca;
        --chip-hold-bg: #3f3f46;
        --chip-hold: #e4e4e7;
        --chip-halt-bg: #7c2d12;
        --chip-halt: #fed7aa;
        --code-bg: #09090b;
        --code-fg: #e4e4e7;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 1200px;
      margin-inline: auto;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    a { color: var(--accent); }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .nav .muted { margin-left: auto; }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.92rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      text-align: left;
      color: var(--fg);
      vertical-align: top;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--thead-bg);
      z-index: 1;
      font-weight: 600;
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr.click-row { cursor: pointer; }
    tbody tr.row-error { background: var(--chip-sell-bg) !important; }
    tbody tr.row-error:hover { filter: brightness(0.95); }
    td { word-break: break-word; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    pre {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 1rem;
      overflow: auto;
      font-size: 0.82rem;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .chip {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .chip-buy { background: var(--chip-buy-bg); color: var(--chip-buy); }
    .chip-sell { background: var(--chip-sell-bg); color: var(--chip-sell); }
    .chip-hold { background: var(--chip-hold-bg); color: var(--chip-hold); }
    .chip-halt { background: var(--chip-halt-bg); color: var(--chip-halt); }
    .chip-placed { background: var(--chip-buy-bg); color: var(--chip-buy); }
    .chip-error { background: var(--chip-sell-bg); color: var(--chip-sell); font-weight: 700; }
    .chip-skipped { background: var(--chip-hold-bg); color: var(--chip-hold); }
    .chip-not_attempted { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      background: var(--row-alt);
    }
    details { margin-bottom: 0.75rem; }
    details summary { cursor: pointer; font-weight: 600; color: var(--fg); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a href="/?token={{ query_token | urlencode }}">Cycles</a>
    <a href="/positions?token={{ query_token | urlencode }}">Positions</a>
    <a href="/flow?token={{ query_token | urlencode }}">Flow</a>
    <a href="/architecture?token={{ query_token | urlencode }}">Architecture</a>
    <a href="/research?token={{ query_token | urlencode }}">Research</a>
    <a href="/blog?token={{ query_token | urlencode }}">{{ blog.nav_label }}</a>
    <span class="muted">Read-only — fills on <strong>Alpaca paper</strong></span>
  </nav>
  {% block body %}{% endblock %}
</body>
</html>
