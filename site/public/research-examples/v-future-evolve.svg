<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d">
  <title id="t">Open-ended evolutionary loop</title>
  <desc id="d">Population of rule variants, mutate, score on paper fitness, keep winners, repeat.</desc>
  <rect width="720" height="220" fill="#fafafa"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="70" width="140" height="64" rx="10" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="94" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Population</text>
    <text x="94" y="118" text-anchor="middle" font-size="11" fill="#52525b">rule variants</text>

    <line x1="164" y1="102" x2="210" y2="102" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="218" y="70" width="140" height="64" rx="10" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="288" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Mutate</text>
    <text x="288" y="118" text-anchor="middle" font-size="11" fill="#52525b">tweak knobs / rules</text>

    <line x1="358" y1="102" x2="404" y2="102" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="412" y="70" width="140" height="64" rx="10" fill="#fff" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="482" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#18181b">Score</text>
    <text x="482" y="118" text-anchor="middle" font-size="11" fill="#52525b">paper fitness</text>

    <line x1="552" y1="102" x2="598" y2="102" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="606" y="70" width="90" height="64" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="651" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Keep</text>
    <text x="651" y="118" text-anchor="middle" font-size="11" fill="#047857">winners</text>

    <path d="M651 134 C651 180 94 180 94 134" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="360" y="198" text-anchor="middle" font-size="12" fill="#71717a">repeat · shape of the search still open</text>
    <text x="360" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#18181b">Future direction (not built yet)</text>
  </g>
</svg>
