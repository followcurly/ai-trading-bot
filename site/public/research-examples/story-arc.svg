    <line x1="562" y1="64" x2="658" y2="64" stroke="#52525b" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="672" cy="64" r="10" fill="none" stroke="#a1a1aa" stroke-width="2"/>
    <text x="672" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e4e4e7">Hope</text>
    <text x="672" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">learn by doing</text>
    <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#e4e4e7">Where I am in the story</text>
    <text x="360" y="148" text-anchor="middle" font-size="10" fill="#71717a">paper capital vs just holding the S&amp;P</text>
