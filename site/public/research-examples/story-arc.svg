    <text x="48" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">LLM desk</text>
    <line x1="62" y1="64" x2="130" y2="64" stroke="#52525b" stroke-width="2"/>
    <circle cx="148" cy="64" r="10" fill="#fbbf24"/>
    <text x="148" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e4e4e7">Built</text>
    <text x="148" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">options stack</text>
    <line x1="162" y1="64" x2="230" y2="64" stroke="#52525b" stroke-width="2"/>
    <circle cx="248" cy="64" r="10" fill="#fb923c"/>
    <text x="248" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e4e4e7">Ended</text>
    <text x="248" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">-15.8% paper</text>
    <line x1="262" y1="64" x2="330" y2="64" stroke="#52525b" stroke-width="2"/>
    <circle cx="348" cy="64" r="10" fill="#34d399"/>
