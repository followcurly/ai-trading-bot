    <text x="348" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">red-day ETFs</text>
    <line x1="362" y1="64" x2="430" y2="64" stroke="#52525b" stroke-width="2"/>
    <circle cx="448" cy="64" r="10" fill="#6ee7b7"/>
    <text x="448" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e4e4e7">Score</text>
    <text x="448" y="114" text-anchor="middle" font-size="10" fill="#a1a1aa">vs S&amp;P hold</text>
    <line x1="462" y1="64" x2="530" y2="64" stroke="#52525b" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="548" cy="64" r="10" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <text x="548" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e4e4e7">Next</text>
